services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traceflow
      POSTGRES_PASSWORD: traceflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: traceflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: catalog-service
    ports:
      - "8081:8081"
    environment:
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/catalog
      QUARKUS_DATASOURCE_USERNAME: traceflow
      QUARKUS_DATASOURCE_PASSWORD: traceflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inspection-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: inspection-service
    ports:
      - "8082:8082"
    environment:
      QUARKUS_HTTP_PORT: "8082"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/inspection
      QUARKUS_DATASOURCE_USERNAME: traceflow
      QUARKUS_DATASOURCE_PASSWORD: traceflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        MODULE: notification-service
    ports:
      - "8083:8083"
    environment:
      QUARKUS_HTTP_PORT: "8083"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/notification
      QUARKUS_DATASOURCE_USERNAME: traceflow
      QUARKUS_DATASOURCE_PASSWORD: traceflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
