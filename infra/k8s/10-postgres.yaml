apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: traceflow
stringData:
  POSTGRES_USER: traceflow
  POSTGRES_PASSWORD: traceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: traceflow
data:
  init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        CREATE DATABASE catalog;
        CREATE DATABASE inspection;
        CREATE DATABASE notification;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: traceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "traceflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: traceflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
