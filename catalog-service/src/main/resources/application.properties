quarkus.application.name=catalog-service
quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=traceflow
quarkus.datasource.password=traceflow
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalog

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.smallrye-openapi.info-title=TraceFlow Catalog API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.http.cors.enabled=true

mp.messaging.outgoing.outbox-out.connector=smallrye-kafka
mp.messaging.outgoing.outbox-out.topic=outbox.placeholder
mp.messaging.outgoing.outbox-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.dead-letter-out.connector=smallrye-kafka
mp.messaging.outgoing.dead-letter-out.topic=traceflow.dlq
mp.messaging.outgoing.dead-letter-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.inspection-completed-in.connector=smallrye-kafka
mp.messaging.incoming.inspection-completed-in.topic=inspection.completed
mp.messaging.incoming.inspection-completed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inspection-completed-in.auto.offset.reset=earliest
mp.messaging.incoming.inspection-completed-in.group.id=catalog-service

kafka.bootstrap.servers=localhost:9092

quarkus.container-image.group=traceflow
quarkus.container-image.name=catalog-service
quarkus.container-image.tag=1.0.0

%test.quarkus.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.enabled=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.mp.messaging.outgoing.outbox-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.dead-letter-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.inspection-completed-in.connector=smallrye-in-memory
%test.quarkus.scheduler.enabled=false
